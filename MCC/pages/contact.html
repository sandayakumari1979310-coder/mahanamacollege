<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Mahanama College Monaragala</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800">

    <header class="bg-white border-b py-4 px-8 flex justify-between items-center shadow-sm sticky top-0 z-40">
        <a href="../index.html" class="font-bold text-xl text-rose-900">MAHANAMA COLLEGE</a>
        <nav class="hidden md:flex gap-6 text-sm font-semibold">
            <a href="../index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="contact.html" class="text-rose-900">Contact</a>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto py-12 px-4 space-y-12">
        <div class="text-center space-y-2">
            <span class="text-amber-600 font-bold uppercase tracking-widest text-xs">Get In Touch</span>
            <h2 class="text-3xl font-extrabold text-slate-900">Contact Mahanama College</h2>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <div class="bg-white p-8 rounded-2xl shadow-sm border space-y-6">
                <h3 class="text-2xl font-bold">Send an Inquiry</h3>
                <form id="contact-form" onsubmit="handleContactSubmit(event)" class="space-y-4">
                    <input type="text" id="c-name" placeholder="Your Name" required class="w-full px-4 py-3 rounded-lg border">
                    <input type="email" id="c-email" placeholder="Email Address" required class="w-full px-4 py-3 rounded-lg border">
                    <input type="text" id="c-phone" placeholder="Phone Number" required class="w-full px-4 py-3 rounded-lg border">
                    <textarea id="c-message" placeholder="Your Message" rows="4" required class="w-full px-4 py-3 rounded-lg border"></textarea>
                    <button type="submit" class="w-full py-3.5 bg-rose-900 text-amber-400 font-bold rounded-lg hover:bg-rose-950">Submit Message</button>
                </form>
            </div>
            <div class="bg-slate-950 text-white p-8 rounded-2xl border border-amber-500/30 flex flex-col justify-between">
                <div class="space-y-4 text-sm">
                    <h3 class="text-2xl font-bold text-amber-400">Contact Information</h3>
                    <p><i class="fa-solid fa-location-dot text-amber-400 mr-2"></i> Pottuvil Rd, Monaragala, Sri Lanka</p>
                    <p><i class="fa-solid fa-phone text-amber-400 mr-2"></i> +94 55 22 763 12</p>
                    <p><i class="fa-solid fa-envelope text-amber-400 mr-2"></i> mahanamacc@sch.lk</p>
                </div>
                <div class="rounded-xl overflow-hidden h-64 mt-6">
                    <iframe width="100%" height="100%" frameborder="0" src="https://maps.google.com/maps?q=Monaragala&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>
                </div>
            </div>
        </div>
    </main>

    <script src="../script.js"></script>
</body>
</html>
