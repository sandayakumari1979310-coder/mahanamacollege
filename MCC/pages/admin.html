<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Mahanama College Monaragala</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-slate-50 text-slate-800">

    <header class="bg-white border-b py-4 px-8 flex justify-between items-center shadow-sm sticky top-0 z-40">
        <a href="../index.html" class="font-bold text-xl text-rose-900">MAHANAMA COLLEGE</a>
        <nav class="hidden md:flex gap-6 text-sm font-semibold">
            <a href="../index.html">Home</a>
            <a href="admin.html" class="text-rose-900">Admin Portal</a>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto py-12 px-4 space-y-8">
        <div id="admin-login-box" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border space-y-6">
            <h2 class="text-2xl font-bold text-center">Admin Portal Login</h2>
            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <input type="password" id="admin-pass" placeholder="Enter Passcode (admin123)" required class="w-full px-4 py-3 rounded-lg border">
                <button type="submit" class="w-full py-3 bg-rose-900 text-amber-400 font-bold rounded-lg">Login</button>
            </form>
        </div>

        <div id="admin-dashboard-box" class="hidden space-y-8">
            <div class="flex justify-between items-center bg-white p-6 rounded-2xl border">
                <h2 class="text-2xl font-bold">Admin Control Center</h2>
                <button onclick="handleAdminLogout()" class="px-4 py-2 bg-red-50 text-red-700 font-bold rounded-lg">Logout</button>
            </div>
            <div id="admin-inquiries-list" class="bg-white p-6 rounded-2xl border"></div>
        </div>
    </main>

    <script src="../script.js"></script>
</body>
</html>
